application:
  subdomain: libretranslate
  multi_instance: false
  upstreams:
    - location: /
      backend: http://libretranslate:5000/
services:
  libretranslate:
    # upstream: libretranslate/libretranslate:v1.9.6
    image: docker.1ms.run/libretranslate/libretranslate:v1.9.6
    environment:
      # Download the language models on first start rather than shipping them
      # in the image; they land in the persisted .local volume below.
      - LT_UPDATE_MODELS=true
      # Left unauthenticated on purpose: the app has no account system of its
      # own, so access is gated by the LazyCat entry in front of it.
    binds:
      # Translation models live here; persisting the volume avoids
      # re-downloading every model on each restart.
      - /lzcapp/var/models:/home/libretranslate/.local
      # API keys (only used when LT_API_KEYS is enabled) live here.
      - /lzcapp/var/db:/app/db
    healthcheck:
      test: ["CMD-SHELL", "./venv/bin/python scripts/healthcheck.py || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
usage: |
  LibreTranslate 是自托管的机器翻译服务：翻译引擎由开源的 Argos Translate 驱动，
  **完全在本地完成翻译，不把文本发给 Google、Azure 等第三方**，同时提供网页界面与 API。

  - 首次启动会自动下载翻译模型，需要一些时间；模型保存在持久化目录里，
    以后重启不会重新下载。
  - 默认只装了少量语言，需要更多语言可设置 LT_LOAD_ONLY 或让它按需下载。
  - 本应用没有自己的账号体系，访问由懒猫入口负责鉴权；
    如果需要给外部程序调用，可在环境变量里开启 LT_API_KEYS 使用 API 密钥。
  - 未做真机验证：首次启动下载模型、网页与 API 翻译、重启后模型留存
    均未在设备上实测。
